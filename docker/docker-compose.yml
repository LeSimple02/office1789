version: "3.8"

services:
  postgres_db:
    image: postgres:16
    container_name: postgres_db
    environment:
      POSTGRES_USER: robespierre
      POSTGRES_PASSWORD: guillotine
      POSTGRES_DB: office1789
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - office_network

  mailserver:
    image: mailserver/docker-mailserver:latest
    container_name: mailserver
    hostname: mail.office1789.local
    domainname: office1789.local
    ports:
      - "25:25"
      - "143:143"
      - "587:587"
      - "993:993"
    volumes:
      - maildata:/var/mail
      - mailstate:/var/mail-state
      - maillogs:/var/log/mail
      - ./config:/tmp/docker-mailserver/
      - ./config/ssl/cert.pem:/etc/ssl/dms/cert:ro
      - ./config/ssl/key.pem:/etc/ssl/dms/key:ro
    environment:
      - ENABLE_SPAMASSASSIN=0
      - ENABLE_CLAMAV=0
      - ENABLE_FAIL2BAN=0
      - ENABLE_POSTGREY=0
      - ONE_DIR=1
      - DMS_DEBUG=0
      - PERMIT_DOCKER=network
      - SSL_TYPE=manual
      - TLS_LEVEL=modern
      - SSL_CERT_PATH=/etc/ssl/dms/cert
      - SSL_KEY_PATH=/etc/ssl/dms/key
    cap_add:
      - NET_ADMIN
    restart: always
    networks:
      office_network:
        aliases:
          - mail.office1789.local

  

  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: onlyoffice
    ports:
      - "8082:80"
    environment:
      - JWT_ENABLED=false
      - JWT_SECRET=changeme_verysecret
      - ALLOW_PRIVATE_IP_ADDRESS=true
      - ALLOW_META_IP_ADDRESS=true
    restart: always
    networks:
      - office_network

  # PostgreSQL for Roundcube
  postgres_roundcube:
    image: postgres:16
    container_name: postgres_roundcube
    environment:
      POSTGRES_DB: roundcube
      POSTGRES_USER: roundcube
      POSTGRES_PASSWORD: roundcube1789
    healthcheck:
      # Use superuser for healthcheck to avoid failure if role roundcube not yet ready
      test: ["CMD-SHELL", "pg_isready -U postgres || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - roundcube_db:/var/lib/postgresql/data
    networks:
      - office_network

  # Roundcube Webmail
  roundcube:
    build:
      context: ./DockerfileRoundcube
      dockerfile: Dockerfile
    container_name: roundcube
    ports:
      - "8081:80"
    environment:
      ROUNDCUBEMAIL_DB_TYPE: pgsql
      ROUNDCUBEMAIL_DB_HOST: postgres_roundcube
      ROUNDCUBEMAIL_DB_NAME: roundcube
      ROUNDCUBEMAIL_DB_USER: roundcube
      ROUNDCUBEMAIL_DB_PASSWORD: roundcube1789
      ROUNDCUBEMAIL_DEFAULT_HOST: ssl://mail.office1789.local
      ROUNDCUBEMAIL_DEFAULT_PORT: 993
      ROUNDCUBEMAIL_SMTP_SERVER: tls://mail.office1789.local
      ROUNDCUBEMAIL_SMTP_PORT: 587
      ROUNDCUBEMAIL_SKIN: elastic
      ROUNDCUBEMAIL_PLUGINS: archive,zipdownload
    depends_on:
      mailserver:
        condition: service_started
      postgres_roundcube:
        condition: service_healthy
    networks:
      - office_network

  # PostgreSQL for Synapse (Matrix)
  postgres_synapse:
    image: postgres:16
    container_name: postgres_synapse
    environment:
      POSTGRES_DB: synapse
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: synapse1789
    healthcheck:
      # Use superuser for healthcheck to avoid failure if role synapse not yet ready
      test: ["CMD-SHELL", "pg_isready -U postgres || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - synapse_db:/var/lib/postgresql/data
    networks:
      - office_network

  # Synapse Homeserver
  synapse:
    image: matrixdotorg/synapse:latest
    container_name: synapse
    ports:
      - "8008:8008"
    environment:
      SYNAPSE_SERVER_NAME: office1789.com
      SYNAPSE_REPORT_STATS: "no"
      SYNAPSE_NO_TLS: "true"
      POSTGRES_HOST: postgres_synapse
      POSTGRES_DB: synapse
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: synapse1789
    volumes:
      - ./synapse/conf:/data
    depends_on:
      postgres_synapse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys;\n\nimport time\n\nURL=\"http://localhost:8008/_matrix/client/versions\"\n\ntry:\n urllib.request.urlopen(URL, timeout=5); sys.exit(0)\nexcept Exception as e:\n sys.exit(1)'" ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - office_network

  # Element Web (Matrix client) - avec Office1789 SSO
  element:
    build:
      context: ./DockerfileElement
      dockerfile: Dockerfile
    container_name: element
    ports:
      - "8083:80"
    depends_on:
      - synapse
    networks:
      - office_network

  # TURN server for Matrix (VoIP)
  coturn:
    image: instrumentisto/coturn:latest
    container_name: coturn
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
      - "49160-49200:49160-49200/tcp"
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    networks:
      - office_network

networks:
  office_network:
    driver: bridge

volumes:
  pgdata:
  maildata:
  mailstate:
  maillogs:
  roundcube_db:
  synapse_db:
  synapse_data:
