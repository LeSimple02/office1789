version: "3.8"

services:
  postgres_db:
    image: postgres:16
    container_name: postgres_db
    environment:
      POSTGRES_USER: robespierre
      POSTGRES_PASSWORD: guillotine
      POSTGRES_DB: office1789
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - office_network

  mailserver:
    image: mailserver/docker-mailserver:latest
    container_name: mailserver
    hostname: mail.office1789.local
    domainname: office1789.local
    ports:
      - "25:25"
      - "143:143"
      - "587:587"
      - "993:993"
    volumes:
      - maildata:/var/mail
      - mailstate:/var/mail-state
      - maillogs:/var/log/mail
      - ./config:/tmp/docker-mailserver/
    environment:
      - ENABLE_SPAMASSASSIN=0
      - ENABLE_CLAMAV=0
      - ENABLE_FAIL2BAN=0
      - ENABLE_POSTGREY=0
      - ONE_DIR=1
      - DMS_DEBUG=0
      - PERMIT_DOCKER=network
      - SSL_TYPE=none
    cap_add:
      - NET_ADMIN
    restart: always
    networks:
      - office_network

  snappymail:
    image: ghcr.io/the-djmaze/snappymail:latest
    container_name: snappymail
    ports:
      - "8081:8888"
    depends_on:
      - mailserver
    volumes:
      - snappydata:/var/lib/snappymail
    networks:
      - office_network

  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: onlyoffice
    ports:
      - "8082:80"
    environment:
      - JWT_ENABLED=false
      - JWT_SECRET=changeme_verysecret
      - ALLOW_PRIVATE_IP_ADDRESS=true
      - ALLOW_META_IP_ADDRESS=true
    restart: always
    networks:
      - office_network

networks:
  office_network:
    driver: bridge

volumes:
  pgdata:
  maildata:
  mailstate:
  maillogs:
  snappydata:
