# Load all environment variables from .env file
services:
  # Backend API (Go) - DÉSACTIVÉ, lancé en local via startOffice1789.py
  # backend:
  #   build:
  #     context: ../backend
  #     dockerfile: Dockerfile
  #   container_name: office1789_backend
  #   env_file:
  #     - ../backend/.env
  #   ports:
  #     - "8080:8080"
  #   volumes:
  #     - ../backend/uploads:/root/uploads
  #   depends_on:
  #     - postgres_db
  #   restart: unless-stopped
  #   networks:
  #     - office_network

  # Frontend (Vue.js) - DÉSACTIVÉ, lancé en local via startOffice1789.py
  # frontend:
  #   build:
  #     context: ../webfront2
  #     dockerfile: Dockerfile
  #     args:
  #       - NODE_ENV=production
  #   container_name: office1789_frontend
  #   ports:
  #     - "5173:80"
  #   depends_on:
  #     - backend
  #   restart: unless-stopped
  #   networks:
  #     - office_network

  postgres_db:
    image: postgres:16
    container_name: postgres_db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - office_network

  mailserver:
    image: mailserver/docker-mailserver:latest
    container_name: mailserver
    hostname: mail.office1789.com
    domainname: office1789.com
    env_file:
      - .env
    ports:
      - "25:25"
      - "143:143"
      - "587:587"
      - "993:993"
    volumes:
      - maildata:/var/mail
      - mailstate:/var/mail-state
      - maillogs:/var/log/mail
      - ./config:/tmp/docker-mailserver/
      - ./config/ssl/cert.pem:/etc/ssl/dms/cert:ro
      - ./config/ssl/key.pem:/etc/ssl/dms/key:ro
    environment:
      - ENABLE_SPAMASSASSIN=0
      - ENABLE_CLAMAV=0
      - ENABLE_FAIL2BAN=0
      - ENABLE_POSTGREY=0
      - ONE_DIR=1
      - DMS_DEBUG=0
      - PERMIT_DOCKER=network
      - SSL_TYPE=manual
      - TLS_LEVEL=modern
      - SSL_CERT_PATH=/etc/ssl/dms/cert
      - SSL_KEY_PATH=/etc/ssl/dms/key
      - POSTMASTER_PASSWORD=${MAIL_ADMIN_PASSWORD}
    cap_add:
      - NET_ADMIN
    restart: always
    networks:
      office_network:
        aliases:
          - mail.office1789.com

  

  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: onlyoffice
    env_file:
      - .env
    ports:
      - "8082:80"
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET}
      - ALLOW_PRIVATE_IP_ADDRESS=true
      - ALLOW_META_IP_ADDRESS=true
    restart: always
    networks:
      - office_network

  # PostgreSQL for Roundcube
  postgres_roundcube:
    image: postgres:16
    container_name: postgres_roundcube
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${ROUNDCUBE_DB_NAME}
      POSTGRES_USER: ${ROUNDCUBE_DB_USER}
      POSTGRES_PASSWORD: ${ROUNDCUBE_DB_PASSWORD}
    healthcheck:
      # Use superuser for healthcheck to avoid failure if role roundcube not yet ready
      test: ["CMD-SHELL", "pg_isready -U postgres || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - roundcube_db:/var/lib/postgresql/data
    networks:
      - office_network

  # Roundcube Webmail
  roundcube:
    build:
      context: ./DockerfileRC
      dockerfile: Dockerfile
    container_name: roundcube
    env_file:
      - .env
    ports:
      - "8081:80"
    volumes:
      - ./DockerfileRC/config.local.inc.php:/var/www/html/config/config.local.inc.php:ro
    environment:
      ROUNDCUBEMAIL_DB_TYPE: pgsql
      ROUNDCUBEMAIL_DB_HOST: postgres_roundcube
      ROUNDCUBEMAIL_DB_NAME: ${ROUNDCUBE_DB_NAME}
      ROUNDCUBEMAIL_DB_USER: ${ROUNDCUBE_DB_USER}
      ROUNDCUBEMAIL_DB_PASSWORD: ${ROUNDCUBE_DB_PASSWORD}
      ROUNDCUBEMAIL_DEFAULT_HOST: tls://mailserver
      ROUNDCUBEMAIL_DEFAULT_PORT: 143
      ROUNDCUBEMAIL_SMTP_SERVER: tls://mailserver
      ROUNDCUBEMAIL_SMTP_PORT: 587
      ROUNDCUBEMAIL_SKIN: elastic
      ROUNDCUBEMAIL_PLUGINS: office1789_sso,archive,zipdownload
    depends_on:
      mailserver:
        condition: service_started
      postgres_roundcube:
        condition: service_healthy
    networks:
      - office_network

  # PostgreSQL for Synapse (Matrix)
  postgres_synapse:
    image: postgres:16
    container_name: postgres_synapse
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${SYNAPSE_DB_NAME}
      POSTGRES_USER: ${SYNAPSE_DB_USER}
      POSTGRES_PASSWORD: ${SYNAPSE_DB_PASSWORD}
    healthcheck:
      # Use superuser for healthcheck to avoid failure if role synapse not yet ready
      test: ["CMD-SHELL", "pg_isready -U postgres || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - synapse_db:/var/lib/postgresql/data
    networks:
      - office_network

  # Synapse Homeserver
  synapse:
    image: matrixdotorg/synapse:latest
    container_name: synapse
    env_file:
      - .env
    ports:
      - "8008:8008"
    environment:
      SYNAPSE_SERVER_NAME: office1789.com
      SYNAPSE_REPORT_STATS: "no"
      SYNAPSE_NO_TLS: "true"
      POSTGRES_HOST: postgres_synapse
      POSTGRES_DB: ${SYNAPSE_DB_NAME}
      POSTGRES_USER: ${SYNAPSE_DB_USER}
      POSTGRES_PASSWORD: ${SYNAPSE_DB_PASSWORD}
    volumes:
      - ./synapse/conf:/data
    depends_on:
      postgres_synapse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys;\n\nimport time\n\nURL=\"http://localhost:8008/_matrix/client/versions\"\n\ntry:\n urllib.request.urlopen(URL, timeout=5); sys.exit(0)\nexcept Exception as e:\n sys.exit(1)'" ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - office_network

  # Element Web (Matrix client) - avec Office1789 SSO
  element:
    build:
      context: ./DockerfileElement
      dockerfile: Dockerfile
    container_name: element
    ports:
      - "8083:80"
    depends_on:
      - synapse
    networks:
      - office_network

  # TURN server for Matrix (VoIP)
  coturn:
    image: instrumentisto/coturn:latest
    container_name: coturn
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49170:49160-49170/udp"
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf
    networks:
      - office_network

networks:
  office_network:
    driver: bridge

volumes:
  pgdata:
  maildata:
  mailstate:
  maillogs:
  roundcube_db:
  synapse_db:
  synapse_data:
