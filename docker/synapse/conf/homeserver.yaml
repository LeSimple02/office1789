server_name: "office1789.com"
report_stats: false

listeners:
  - port: 8008
    tls: false
    type: http
    x_forwarded: false
    bind_addresses: ['0.0.0.0']
    resources:
      - names: [client]
        compress: false

media_store_path: "/data/media_store"
signing_key_path: "/tmp/homeserver.signing.key"

enable_registration: false
registration_shared_secret: "OFFICE1789_REGISTRATION_SECRET"

# Configuration du système de mot de passe
password_config:
  enabled: true
  localdb_enabled: true
  pepper: ""

enable_set_displayname: true
enable_set_avatar_url: true
enable_3pid_changes: false

# PostgreSQL database configuration
database:
  name: psycopg2
  allow_unsafe_locale: true
  args:
    user: synapse
    password: synapse
    database: synapse
    host: postgres_synapse
    port: 5432
    cp_min: 5
    cp_max: 10

# TURN / VoIP configuration
turn_uris:
  - "turn:localhost:3478?transport=udp"
  - "turn:localhost:3478?transport=tcp"
turn_shared_secret: "MY_TURN_SECRET_1789"
turn_user_lifetime: 1h

# Rate limiting configuration - Augmenté pour SSO Office1789
rc_login:
  address:
    per_second: 10
    burst_count: 20
  account:
    per_second: 5
    burst_count: 10
  failed_attempts:
    per_second: 1
    burst_count: 5
