events {}

http {
  # Rate limiting zones
  limit_req_zone $binary_remote_addr zone=matrix_limit:10m rate=5r/s;
  limit_req_zone $binary_remote_addr zone=matrix_api:10m rate=10r/s;
  
  server {
    listen 80;
    server_name _;

    # Roundcube webmail - SSO uniquement (bloquer login direct)
    location /roundcube/ {
      # Bloquer la page de login direct (seul SSO autorisé)
      if ($request_uri !~* "sso_token=") {
        if ($request_uri ~* "^/roundcube/?$") {
          return 403 "Accès direct interdit. Veuillez vous connecter via Office1789.";
        }
        if ($request_uri ~* "task=login") {
          return 403 "Connexion directe désactivée. Utilisez Office1789.";
        }
      }
      
      proxy_pass http://roundcube:80/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Element (Matrix client) - Accès restreint
    location /element/ {
      # Limiter les tentatives de connexion (rate limiting)
      limit_req zone=matrix_limit burst=10 nodelay;
      
      proxy_pass http://element:80/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      
      # Headers de sécurité
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
    }

    # Matrix API passthrough - Sécurisé
    location /_matrix/ {
      # Rate limiting pour prévenir brute force
      limit_req zone=matrix_api burst=20 nodelay;
      
      # Bloquer l'API Admin depuis l'extérieur
      location ~ ^/_matrix/client/r0/admin {
        deny all;
        return 403;
      }
      
      location ~ ^/_matrix/client/v3/admin {
        deny all;
        return 403;
      }
      
      location ~ ^/_synapse/admin {
        deny all;
        return 403;
      }
      
      # Bloquer les endpoints d'enregistrement (registration désactivé dans Synapse)
      location ~ ^/_matrix/client/(r0|v3)/register {
        deny all;
        return 403 "Enregistrement désactivé. Contactez l'administrateur.";
      }
      
      proxy_pass http://synapse:8008/_matrix/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      
      # Timeouts pour éviter les attaques slowloris
      proxy_connect_timeout 10s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
    }
  }
}
