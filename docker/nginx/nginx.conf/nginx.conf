events {}

http {
  server {
    listen 80;
    server_name _;

    # Roundcube webmail
    location /roundcube/ {
      proxy_pass http://roundcube:80/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Element (Matrix client)
    location /element/ {
      proxy_pass http://element:80/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Matrix API passthrough
    location /_matrix/ {
      # Bloquer l'API Admin depuis l'extérieur
      location ~ ^/_matrix/client/r0/admin {
        deny all;
        return 403;
      }
      
      location ~ ^/_matrix/client/v3/admin {
        deny all;
        return 403;
      }
      
      location ~ ^/_synapse/admin {
        deny all;
        return 403;
      }
      
      proxy_pass http://synapse:8008/_matrix/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
